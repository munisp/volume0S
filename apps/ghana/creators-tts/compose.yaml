# Creators Home models on ghana. Ports are published on the Tailscale address only.
services:
  creators-tts:
    build: .
    image: creators-tts:1
    restart: unless-stopped
    env_file: /home/newwave-dgx/creators-home/secrets.env
    ports: ["100.88.112.5:8880:8880"]
    volumes: ["/home/newwave-dgx/hf-cache:/models"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  creators-image:
    build: ./creators-image   # on ghana: ~/creators-home/creators-image
    image: creators-image:1
    restart: unless-stopped
    env_file: /home/newwave-dgx/creators-home/secrets.env
    environment: [HF_HUB_OFFLINE=1]
    ports: ["100.88.112.5:8890:8890"]
    volumes: ["/home/newwave-dgx/creators-home/models:/models"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  creators-render:
    build: ./creators-render   # on ghana: ~/creators-home/creators-render
    image: creators-render:1
    restart: unless-stopped
    env_file: /home/newwave-dgx/creators-home/secrets.env
    ports: ["100.88.112.5:8895:8895"]
    volumes: ["/home/newwave-dgx/creators-home/render-work:/work"]
  creators-motion:
    build: ./creators-motion   # on ghana: ~/creators-home/creators-motion
    image: creators-motion:1
    restart: unless-stopped
    env_file: /home/newwave-dgx/creators-home/secrets.env
    environment: [HF_HUB_OFFLINE=1]
    ports: ["100.88.112.5:8892:8892"]
    volumes: ["/home/newwave-dgx/creators-home/models:/models"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
