apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-rollup-flink
  namespace: data
  labels: {app.kubernetes.io/name: usage-rollup-flink, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: usage-rollup
  namespace: data
  labels: {app.kubernetes.io/name: usage-rollup-flink, app.kubernetes.io/part-of: volumeos}
spec:
  image: ghcr.io/munisp/usage-rollup-flink:0.1.0
  imagePullPolicy: IfNotPresent
  flinkVersion: v1_20
  serviceAccount: usage-rollup-flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    table.local-time-zone: UTC
    execution.checkpointing.interval: 60s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.unaligned.enabled: "true"
    state.checkpoints.dir: s3://flink-checkpoints/usage-rollup
    s3.endpoint: http://minio.data.svc.cluster.local:9000
    s3.path.style.access: "true"
    restart-strategy.type: failure-rate
    restart-strategy.failure-rate.max-failures-per-interval: "3"
    restart-strategy.failure-rate.failure-rate-interval: 10min
  jobManager:
    resource: {cpu: 1, memory: 1024m}
  taskManager:
    resource: {cpu: 1, memory: 2048m}
    replicas: 2
  podTemplate:
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: flink-main-container
          envFrom:
            - secretRef: {name: flink-s3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: flink-log, mountPath: /opt/flink/log}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: flink-log, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-rollup-submit
  namespace: data
  labels: {app.kubernetes.io/name: usage-rollup-submit, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: usage-rollup-submit}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: usage-rollup-submit, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: usage-rollup-flink
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: submit
          image: ghcr.io/munisp/usage-rollup-flink:0.1.0
          imagePullPolicy: IfNotPresent
          command: [/opt/flink/bin/flink, run]
          args: [-m, usage-rollup-jobmanager:8081, -py, /opt/volumeos/rollup_job.py]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: kafka-bootstrap-servers}}
            - name: KAFKA_USAGE_TOPIC
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: usage-topic}}
            - name: KAFKA_ROLLUP_TOPIC
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: rollup-topic}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: flink-log, mountPath: /opt/flink/log}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: flink-log, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
