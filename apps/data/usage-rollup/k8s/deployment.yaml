apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-billing-dispatcher
  namespace: data
  labels: {app.kubernetes.io/name: usage-billing-dispatcher, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-billing-dispatcher
  namespace: data
  labels: {app.kubernetes.io/name: usage-billing-dispatcher, app.kubernetes.io/part-of: volumeos}
spec:
  # One replica replays the compacted topic and owns the in-memory open-day set.
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: usage-billing-dispatcher}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: usage-billing-dispatcher, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: usage-billing-dispatcher
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dispatcher
          image: ghcr.io/munisp/usage-billing-dispatcher:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: TEMPORAL_HOSTPORT, value: temporal-frontend.ops.svc.cluster.local:7233}
            - {name: TEMPORAL_NAMESPACE, value: volumeos}
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: kafka-bootstrap-servers}}
            - name: KAFKA_ROLLUP_TOPIC
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: rollup-topic}}
            - name: USAGE_CLOSE_DELAY_HOURS
              valueFrom: {configMapKeyRef: {name: usage-rollup, key: close-delay-hours}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
