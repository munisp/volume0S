apiVersion: v1
kind: ServiceAccount
metadata: {name: report-search, namespace: data}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-search, namespace: data}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: report-search}}
  template:
    metadata: {labels: {app.kubernetes.io/name: report-search}}
    spec:
      serviceAccountName: report-search
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/report-search:0.1.0
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: OPENSEARCH_URL, value: https://opensearch-cluster-master.data.svc.cluster.local:9200}
            - name: OPENSEARCH_USERNAME
              valueFrom: {secretKeyRef: {name: report-search, key: opensearch-username}}
            - name: OPENSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: report-search, key: opensearch-password}}
            - name: OIDC_ISSUER
              valueFrom: {secretKeyRef: {name: report-search, key: oidc-issuer}}
            - name: OIDC_AUDIENCE
              valueFrom: {secretKeyRef: {name: report-search, key: oidc-audience}}
            - name: OIDC_JWKS_URL
              valueFrom: {secretKeyRef: {name: report-search, key: oidc-jwks-url}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: report-search, namespace: data}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: report-search}
  ports: [{name: http, port: 80, targetPort: http}]
