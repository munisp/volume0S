apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-tenancy
  namespace: core
  labels: {app.kubernetes.io/name: svc-tenancy, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-tenancy
  namespace: core
  labels: {app.kubernetes.io/name: svc-tenancy, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-tenancy}}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-tenancy, app.kubernetes.io/part-of: volumeos}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: svc-tenancy
        dapr.io/metrics-port: "9090"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: svc-tenancy
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: svc-tenancy
          image: ghcr.io/munisp/svc-tenancy:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: PORT, value: "8080"}
            - {name: VO_ENV, valueFrom: {fieldRef: {fieldPath: "metadata.labels['volumeos.io/env']"}}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-tenancy, key: database-url}}
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-tenancy, key: service-token}}
            - name: SUPPRESSION_HMAC_SECRET
              valueFrom: {secretKeyRef: {name: svc-tenancy, key: suppression-hmac-secret}}
            - name: OIDC_ISSUER
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: issuer}}
            - name: OIDC_AUDIENCE
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: audience}}
            - name: OIDC_JWKS_URL
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: jwks-url}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: svc-tenancy
  namespace: core
  labels: {app.kubernetes.io/name: svc-tenancy, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-tenancy}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: svc-tenancy
  namespace: core
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: svc-tenancy}}
