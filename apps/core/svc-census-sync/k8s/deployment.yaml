apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-census-sync
  namespace: core
  labels: {app.kubernetes.io/name: svc-census-sync, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-census-sync
  namespace: core
  labels: {app.kubernetes.io/name: svc-census-sync, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-census-sync}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-census-sync, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-census-sync
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-census-sync:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-census-sync, key: database-url}}
            - name: CENSUS_MASKING_KEY
              valueFrom: {secretKeyRef: {name: svc-census-sync, key: masking-key-base64}}
            - name: OIDC_ISSUER
              valueFrom: {secretKeyRef: {name: svc-census-sync, key: oidc-issuer}}
            - name: OIDC_AUDIENCE
              valueFrom: {secretKeyRef: {name: svc-census-sync, key: oidc-audience}}
            - name: OIDC_JWKS_URL
              valueFrom: {secretKeyRef: {name: svc-census-sync, key: oidc-jwks-url}}
            - {name: FLUVIO_ENDPOINT, value: fluvio-sc.fluvio.svc.cluster.local:9003}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 150m, memory: 192Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-census-sync
  namespace: core
  labels: {app.kubernetes.io/name: svc-census-sync, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-census-sync}
  ports: [{name: http, port: 80, targetPort: http}]
