apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-campaigns
  namespace: core
  labels: {app.kubernetes.io/name: svc-campaigns, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-campaigns
  namespace: core
  labels: {app.kubernetes.io/name: svc-campaigns, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-campaigns}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-campaigns, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-campaigns
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-campaigns:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-campaigns, key: service-token}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-campaigns, key: database-url}}
            - name: RESEND_API_KEY
              valueFrom: {secretKeyRef: {name: svc-campaigns, key: resend-api-key, optional: true}}
            - {name: TENANCY_URL, value: http://svc-tenancy.core.svc.cluster.local}
            - {name: PROVISIONING_URL, value: http://svc-provisioning.core.svc.cluster.local}
            - {name: OLLAMA_URL, value: http://ollama.ollama.svc.cluster.local:11434}
            - {name: DRAFT_MODEL, value: qwen2.5:7b-instruct}
            - {name: CAMPAIGN_FROM_ADDRESS, value: campaigns@upi.dev}
            - {name: PUBLIC_URL, value: https://volumeos.newfire.app}
            - {name: EMAIL_TEST_DOMAINS, value: ".test,example.com"}
          envFrom:
            # WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_CAMPAIGN_TEMPLATE(_LANGUAGE); optional: without
            # them WhatsApp contacts are simply not messaged.
            - secretRef: {name: campaign-whatsapp, optional: true}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-campaigns
  namespace: core
  labels: {app.kubernetes.io/name: svc-campaigns, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-campaigns}
  ports: [{name: http, port: 80, targetPort: http}]
