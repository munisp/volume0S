apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-billing
  namespace: core
  labels: {app.kubernetes.io/name: svc-billing, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-billing
  namespace: core
  labels: {app.kubernetes.io/name: svc-billing, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-billing}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-billing, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-billing
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-billing:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: TIGERBEETLE_CLUSTER_ID
              valueFrom: {configMapKeyRef: {name: volumeos-money, key: tigerbeetle-cluster-id}}
            - name: TIGERBEETLE_ADDRESSES
              valueFrom: {configMapKeyRef: {name: volumeos-money, key: tigerbeetle-addresses}}
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-billing, key: service-token}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-billing
  namespace: core
  labels: {app.kubernetes.io/name: svc-billing, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-billing}
  ports: [{name: http, port: 80, targetPort: http}]
