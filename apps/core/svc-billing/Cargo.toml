[package]
name = "volumeos-svc-billing"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Tenant-scoped TigerBeetle billing API for VolumeOS workflows"

[dependencies]
axum = "=0.7.9"
constant_time_eq = "=0.3.1"
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.132"
tokio = { version = "=1.41.1", features = ["macros", "rt-multi-thread", "signal"] }
volumeos-tb-adapter = { path = "../../../libs-rust/tb-adapter" }

[dev-dependencies]
futures = "=0.3.31"
http-body-util = "=0.1.1"
tower = { version = "=0.5.2", features = ["util"] }
