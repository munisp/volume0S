[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "volumeos-svc-orchestrator"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "temporalio>=1.18,<2",
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools]
py-modules = ["main", "auth", "assets", "workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
