apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-orchestrator
  namespace: core
  labels: {app.kubernetes.io/name: svc-orchestrator, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-orchestrator
  namespace: core
  labels: {app.kubernetes.io/name: svc-orchestrator, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-orchestrator}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-orchestrator, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-orchestrator
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-orchestrator:0.3.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: TEMPORAL_HOSTPORT, value: temporal-frontend.ops.svc.cluster.local:7233}
            - {name: TEMPORAL_NAMESPACE, value: volumeos}
            - {name: ASSET_BUCKET, value: assets}
            - {name: S3_ENDPOINT_URL, value: http://minio.data.svc.cluster.local:9000}
            - {name: QA_URL_EXPIRY_SECONDS, value: "300"}
            - name: OIDC_ISSUER
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: issuer}}
            - name: OIDC_AUDIENCE
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: audience}}
            - name: OIDC_JWKS_URL
              valueFrom: {configMapKeyRef: {name: volumeos-identity, key: jwks-url}}
          envFrom:
            - secretRef: {name: svc-orchestrator}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-orchestrator
  namespace: core
  labels: {app.kubernetes.io/name: svc-orchestrator, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-orchestrator}
  ports: [{name: http, port: 80, targetPort: http}]
