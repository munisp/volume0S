apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-creators}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-creators
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-creators:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-creators, key: service-token}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-creators, key: database-url}}
            # Open-source models on ghana (DGX Spark, over Tailscale): scripts from Ollama, voices from creators-tts (Kokoro).
            - {name: SCRIPT_LLM_URL, value: "http://100.88.112.5:11434"}
            - {name: SCRIPT_MODEL, value: "gemma4-26b-64k:latest"}
            - {name: TTS_URL, value: "http://100.88.112.5:8880"}
            - {name: IMAGE_URL, value: "http://100.88.112.5:8890"}
            - {name: S3_ENDPOINT_URL, value: "http://minio.minio.svc.cluster.local:9000"}
            - {name: ASSET_BUCKET, value: volumeos-assets}
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (asset bucket) and CREATORS_TTS_TOKEN.
            - secretRef: {name: svc-creators}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-creators}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creators-worker
  namespace: core
  labels: {app.kubernetes.io/name: creators-worker, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: creators-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: creators-worker, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-creators
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/munisp/svc-creators:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          env:
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-creators, key: service-token}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-creators, key: database-url}}
            # Open-source models on ghana (DGX Spark, over Tailscale): scripts from Ollama, voices from creators-tts (Kokoro).
            - {name: SCRIPT_LLM_URL, value: "http://100.88.112.5:11434"}
            - {name: SCRIPT_MODEL, value: "gemma4-26b-64k:latest"}
            - {name: TTS_URL, value: "http://100.88.112.5:8880"}
            - {name: IMAGE_URL, value: "http://100.88.112.5:8890"}
            - {name: S3_ENDPOINT_URL, value: "http://minio.minio.svc.cluster.local:9000"}
            - {name: ASSET_BUCKET, value: volumeos-assets}
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (asset bucket) and CREATORS_TTS_TOKEN.
            - secretRef: {name: svc-creators}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
