apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-creators}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-creators
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-creators:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-creators, key: service-token}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-creators, key: database-url}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-creators
  namespace: core
  labels: {app.kubernetes.io/name: svc-creators, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-creators}
  ports: [{name: http, port: 80, targetPort: http}]
