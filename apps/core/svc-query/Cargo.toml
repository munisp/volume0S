[package]
name = "volumeos-svc-query"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "volumeos_svc_query"
path = "src/lib.rs"

[dependencies]
arrow = { version = "53", features = ["prettyprint"] }
axum = "0.7"
chrono = "0.4"
datafusion = "43"
deltalake = { version = "0.25", default-features = false, features = ["datafusion"] }
futures = "0.3"
jsonwebtoken = "9"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.12"
tower = "0.5"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
datafusion = "43"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
