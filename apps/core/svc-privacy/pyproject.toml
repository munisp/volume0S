[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "volumeos-svc-privacy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "asyncpg>=0.30,<1", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools]
py-modules = ["main", "auth", "privacy", "redaction", "store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
