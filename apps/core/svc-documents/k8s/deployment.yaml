apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-documents
  namespace: core
  labels: {app.kubernetes.io/name: svc-documents, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-documents
  namespace: core
  labels: {app.kubernetes.io/name: svc-documents, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-documents}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-documents, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-documents
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-documents:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-documents, key: service-token}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-documents, key: database-url}}
            - {name: BILLING_SERVICE_URL, value: http://svc-billing.core.svc.cluster.local}
            - {name: S3_ENDPOINT_URL, value: http://minio.data.svc.cluster.local:9000}
            - {name: FINANCIAL_EXPORT_BUCKET, value: finance-archive}
            - {name: FINANCIAL_EXPORT_RETENTION_DAYS, value: "2555"}
          envFrom:
            - secretRef: {name: whatsapp-provider}
            - secretRef: {name: svc-documents}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 150m, memory: 192Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-documents
  namespace: core
  labels: {app.kubernetes.io/name: svc-documents, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-documents}
  ports: [{name: http, port: 80, targetPort: http}]
