apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-leads
  namespace: core
  labels: {app.kubernetes.io/name: svc-leads, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-leads
  namespace: core
  labels: {app.kubernetes.io/name: svc-leads, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: svc-leads}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: svc-leads, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: svc-leads
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/munisp/svc-leads:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: svc-leads, key: database-url}}
            - name: GOLD_QUERY_URL
              valueFrom: {configMapKeyRef: {name: volumeos-query, key: gold-query-url}}
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: svc-leads, key: service-token}}
            - name: OIDC_ISSUER
              valueFrom: {configMapKeyRef: {name: volumeos-oidc, key: issuer}}
            - name: OIDC_AUDIENCE
              valueFrom: {configMapKeyRef: {name: volumeos-oidc, key: audience}}
            - name: OIDC_JWKS_URL
              valueFrom: {configMapKeyRef: {name: volumeos-oidc, key: jwks-url}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-leads
  namespace: core
  labels: {app.kubernetes.io/name: svc-leads, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: svc-leads}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: svc-leads
  namespace: core
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: svc-leads}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: core}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data}}
      ports: [{port: 5432, protocol: TCP}]
    # HTTPS is restricted further by the cluster egress gateway to configured OIDC/query hosts.
    - ports: [{port: 443, protocol: TCP}]
