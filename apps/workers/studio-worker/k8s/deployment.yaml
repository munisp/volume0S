apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-worker
  namespace: workers
  labels: {app.kubernetes.io/name: studio-worker, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-worker
  namespace: workers
  labels: {app.kubernetes.io/name: studio-worker, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: studio-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: studio-worker, app.kubernetes.io/part-of: volumeos}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: studio-worker
    spec:
      serviceAccountName: studio-worker
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/munisp/studio-worker:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: TEMPORAL_HOSTPORT, value: temporal-frontend.ops.svc.cluster.local:7233}
            - {name: TEMPORAL_NAMESPACE, value: volumeos}
            - {name: TEMPORAL_TASK_QUEUE, value: studio-v1}
            - {name: ASSET_BUCKET, value: assets}
            - {name: S3_ENDPOINT_URL, value: http://minio.data.svc.cluster.local:9000}
            - name: COMFYUI_URL
              valueFrom: {configMapKeyRef: {name: studio-worker, key: comfyui-url}}
          envFrom:
            - secretRef: {name: studio-worker}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
