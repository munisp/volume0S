[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "volumeos-insights-indexer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["asyncpg>=0.30,<1", "boto3>=1.35,<2", "opensearch-py>=2.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
