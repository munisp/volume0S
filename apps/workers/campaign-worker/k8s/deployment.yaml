apiVersion: v1
kind: ServiceAccount
metadata:
  name: campaign-worker
  namespace: workers
  labels: {app.kubernetes.io/name: campaign-worker, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-worker
  namespace: workers
  labels: {app.kubernetes.io/name: campaign-worker, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: campaign-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: campaign-worker, app.kubernetes.io/part-of: volumeos}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: campaign-worker
    spec:
      serviceAccountName: campaign-worker
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/munisp/campaign-worker:0.2.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 9091, name: metrics}]
          env:
            - {name: METRICS_PORT, value: "9091"}
            - {name: TEMPORAL_HOSTPORT, value: temporal-frontend.ops.svc.cluster.local:7233}
            - {name: TEMPORAL_NAMESPACE, value: volumeos}
            - {name: TEMPORAL_TASK_QUEUE, value: campaigns-v1}
            - name: AI_GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: ai-gateway-url}}
            - name: TB_ADAPTER_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: tb-adapter-url}}
            - name: CAMPAIGN_DISPATCH_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: campaign-dispatch-url}}
            - name: IDENTITY_ADMIN_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: identity-admin-url}}
            - name: TENANCY_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: tenancy-url}}
            - name: LISTMONK_ADMIN_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: listmonk-admin-url}}
            - name: POSTIZ_PROVISIONER_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: postiz-provisioner-url}}
            - name: MESSAGING_URL
              valueFrom: {configMapKeyRef: {name: campaign-worker, key: messaging-url}}
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: campaign-worker, key: service-token}}
            - name: LISTMONK_ADMIN_USER
              valueFrom: {secretKeyRef: {name: campaign-worker, key: listmonk-admin-user}}
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: campaign-worker, key: listmonk-admin-password}}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: campaign-worker-metrics
  namespace: workers
  labels: {app.kubernetes.io/name: campaign-worker, app.kubernetes.io/part-of: volumeos}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: campaign-worker}
  ports: [{name: metrics, port: 9091, targetPort: metrics}]
