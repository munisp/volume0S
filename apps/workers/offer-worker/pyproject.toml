[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "volumeos-offer-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.18,<2", "httpx>=0.28,<1", "boto3>=1.35,<2", "asyncpg>=0.30,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
[tool.setuptools]
py-modules = ["common", "scorecards", "front_desk", "books", "compliance", "funding", "costs", "worker"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
