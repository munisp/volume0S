apiVersion: v1
kind: ServiceAccount
metadata:
  name: offer-worker
  namespace: workers
  labels: {app.kubernetes.io/name: offer-worker, app.kubernetes.io/part-of: volumeos}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offer-worker
  namespace: workers
  labels: {app.kubernetes.io/name: offer-worker, app.kubernetes.io/part-of: volumeos}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: offer-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: offer-worker, app.kubernetes.io/part-of: volumeos}
    spec:
      serviceAccountName: offer-worker
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/munisp/offer-worker:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal-frontend.ops.svc.cluster.local:7233}
            - {name: TEMPORAL_NAMESPACE, value: volumeos}
            - {name: ASSET_BUCKET, value: assets}
            - {name: S3_ENDPOINT_URL, value: http://minio.data.svc.cluster.local:9000}
            - name: TENANT_AI_CEILING_MINOR
              valueFrom: {configMapKeyRef: {name: offer-worker, key: tenant-ai-ceiling-minor}}
            - name: BILLING_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: billing-service-url}}
            - name: WHISPERX_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: whisperx-url}}
            - name: DOCLING_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: docling-url}}
            - name: BROWSER_AGENT_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: browser-agent-url}}
            - name: REGISTRY_ALLOWLIST
              valueFrom: {configMapKeyRef: {name: offer-worker, key: registry-allowlist}}
            - name: PRIVACY_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: privacy-service-url}}
            - name: FINANCE_TOOLKIT_URL
              valueFrom: {configMapKeyRef: {name: offer-worker, key: finance-toolkit-url}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: offer-worker, key: database-url}}
            - name: VOLUMEOS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: offer-worker, key: service-token}}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offer-worker
  namespace: workers
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: offer-worker}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ops}}
      ports: [{port: 7233, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data}}
      ports: [{port: 5432, protocol: TCP}, {port: 9000, protocol: TCP}]
    # HTTPS is restricted by the egress gateway to configured billing, AI, and offer providers.
    - ports: [{port: 443, protocol: TCP}]
