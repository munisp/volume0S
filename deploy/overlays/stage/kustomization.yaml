apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/core/svc-tenancy/k8s
  - ../../../apps/core/svc-provisioning/k8s
  - ../../../apps/workers/campaign-worker/k8s
  - ../../../apps/workers/studio-worker/k8s
  - ../../../policies
labels:
  - includeSelectors: true
    pairs: {volumeos.io/env: stage}
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
