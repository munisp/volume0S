apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/core/svc-tenancy/k8s
  - ../../../apps/workers/campaign-worker/k8s
  - ../../../apps/workers/studio-worker/k8s
  - ../../../policies
labels:
  - includeSelectors: true
    pairs: {volumeos.io/env: prod}
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
# Production admission must additionally verify digest-pinned images, approved secrets,
# HPA/KEDA, namespace quotas, WAF enforcement, and the quarterly restore-drill evidence.
