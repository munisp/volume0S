apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencti
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: volumeos
  source:
    repoURL: https://devops-ia.github.io/helm-opencti
    targetRevision: 3.0.26
    chart: opencti
    helm:
      values: |
        env:
          APP__ADMIN__EMAIL: admin@volumeos.local
          APP__BASE_URL: http://opencti.sec.svc.cluster.local:8080
  destination:
    server: https://kubernetes.default.svc
    namespace: sec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
