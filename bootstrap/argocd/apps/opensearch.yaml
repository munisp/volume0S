apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: volumeos
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    targetRevision: 3.9.0
    chart: opensearch
    helm:
      values: |
        replicas: 1
        minimumMasterNodes: 1
        persistence:
          enabled: true
          size: 100Gi
        config:
          opensearch.yml: |
            plugins.security.disabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
