apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: volumeos
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 23.1.3
    chart: redis
    helm:
      values: |
        architecture: standalone
        auth:
          enabled: true
        master:
          persistence:
            enabled: true
            size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
