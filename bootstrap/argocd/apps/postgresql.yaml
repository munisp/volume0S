apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: volumeos
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 17.1.2
    chart: postgresql
    helm:
      values: |
        auth:
          database: tenancy
        primary:
          persistence:
            enabled: true
            size: 100Gi
          resources:
            requests: {cpu: 500m, memory: 1Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
