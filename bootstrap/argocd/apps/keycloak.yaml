apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: volumeos
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 25.4.0
    chart: keycloak
    helm:
      values: |
        production: false
        proxy: edge
        postgresql:
          enabled: true
          auth:
            database: keycloak
        keycloakConfigCli:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: sec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
