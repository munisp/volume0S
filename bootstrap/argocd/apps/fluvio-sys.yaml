apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluvio-sys
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: volumeos
  source:
    repoURL: https://github.com/fluvio-community/fluvio.git
    targetRevision: 52673942c1c7364f36f2e05da972436f761243cd
    path: k8-util/helm/fluvio-sys
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
