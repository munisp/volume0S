apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-identity
  namespace: core
data:
  issuer: https://keycloak.sec.svc.cluster.local/realms/volumeos
  audience: core-services
  jwks-url: https://keycloak.sec.svc.cluster.local/realms/volumeos/protocol/openid-connect/certs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-provisioning
  namespace: core
data:
  keycloak-admin-url: https://keycloak.sec.svc.cluster.local/admin/realms/volumeos
  keycloak-admin-token-url: https://keycloak.sec.svc.cluster.local/realms/volumeos/protocol/openid-connect/token
  # The Postiz public API is mounted below /api in the reviewed deployment.
  postiz-url: http://postiz.core.svc.cluster.local/api
  # This logical Dapr secret store must be supplied by the private secrets overlay.
  postiz-secret-store: volumeos-tenant-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-worker
  namespace: workers
data:
  ai-gateway-url: http://svc-ai-gateway.core.svc.cluster.local
  tb-adapter-url: http://tb-adapter.core.svc.cluster.local
  campaign-dispatch-url: http://svc-campaigns.core.svc.cluster.local
  identity-admin-url: http://svc-provisioning.core.svc.cluster.local
  tenancy-url: http://svc-tenancy.core.svc.cluster.local
  listmonk-admin-url: http://listmonk.core.svc.cluster.local
  postiz-provisioner-url: http://svc-provisioning.core.svc.cluster.local
  messaging-url: http://svc-campaigns.core.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-worker
  namespace: workers
data:
  # Set this to a reviewed internal GPU runtime; there is no public ComfyUI endpoint.
  comfyui-url: http://comfyui.ai.svc.cluster.local:8188
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-tenancy
  namespace: core
spec:
  http:
    - name: tenancy
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/tenants/*, /v1/workspaces, /v1/subscriptions]
      upstreams:
        - name: svc-tenancy
      # svc-tenancy independently verifies RS256 issuer/audience and tenant_id.
      # Add APISIX openid-connect after the Keycloak client secret is delivered by SOPS.
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-tenancy
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-tenancy.core.svc.cluster.local, port: 80, weight: 100}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-orchestrator
  namespace: core
spec:
  http:
    - name: orchestrator
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/campaigns, /v1/campaigns/*, /v1/studio/packs, /v1/studio/packs/*]
      upstreams:
        - name: svc-orchestrator
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: https://console.volumeos.example.com
            allow_methods: GET,POST,OPTIONS
            allow_headers: Authorization,Content-Type,Accept
            expose_headers: Content-Length
            max_age: 300
            allow_credential: false
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-orchestrator
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-orchestrator.core.svc.cluster.local, port: 80, weight: 100}
