apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-identity
  namespace: core
data:
  issuer: https://keycloak.sec.svc.cluster.local/realms/volumeos
  audience: core-services
  jwks-url: https://keycloak.sec.svc.cluster.local/realms/volumeos/protocol/openid-connect/certs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-provisioning
  namespace: core
data:
  keycloak-admin-url: https://keycloak.sec.svc.cluster.local/admin/realms/volumeos
  keycloak-admin-token-url: https://keycloak.sec.svc.cluster.local/realms/volumeos/protocol/openid-connect/token
  # The Postiz public API is mounted below /api in the reviewed deployment.
  postiz-url: http://postiz.core.svc.cluster.local/api
  # This logical Dapr secret store must be supplied by the private secrets overlay.
  postiz-secret-store: volumeos-tenant-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-money
  namespace: core
data:
  # The private environment overlay must point at the provisioned TigerBeetle cluster.
  tigerbeetle-cluster-id: "0"
  tigerbeetle-addresses: tigerbeetle.data.svc.cluster.local:3000
  billing-service-url: http://svc-billing.core.svc.cluster.local
  collections-service-url: http://svc-collections.core.svc.cluster.local
  document-service-url: http://svc-documents.core.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-worker
  namespace: workers
data:
  ai-gateway-url: http://svc-ai-gateway.core.svc.cluster.local
  billing-service-url: http://svc-billing.core.svc.cluster.local
  campaign-dispatch-url: http://svc-campaigns.core.svc.cluster.local
  identity-admin-url: http://svc-provisioning.core.svc.cluster.local
  tenancy-url: http://svc-tenancy.core.svc.cluster.local
  listmonk-admin-url: http://listmonk.core.svc.cluster.local
  postiz-provisioner-url: http://svc-provisioning.core.svc.cluster.local
  messaging-url: http://svc-campaigns.core.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-worker
  namespace: workers
data:
  billing-service-url: http://svc-billing.core.svc.cluster.local
  tenancy-url: http://svc-tenancy.core.svc.cluster.local
  messaging-url: http://svc-campaigns.core.svc.cluster.local
  document-service-url: http://svc-documents.core.svc.cluster.local
  dunning-channels: whatsapp,sms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-worker
  namespace: workers
data:
  # Set this to a reviewed internal GPU runtime; there is no public ComfyUI endpoint.
  comfyui-url: http://comfyui.ai.svc.cluster.local:8188
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-tenancy
  namespace: core
spec:
  http:
    - name: tenancy
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/tenants/*, /v1/workspaces, /v1/subscriptions]
      upstreams:
        - name: svc-tenancy
      # svc-tenancy independently verifies RS256 issuer/audience and tenant_id.
      # Add APISIX openid-connect after the Keycloak client secret is delivered by SOPS.
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-tenancy
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-tenancy.core.svc.cluster.local, port: 80, weight: 100}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-orchestrator
  namespace: core
spec:
  http:
    - name: orchestrator
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/campaigns, /v1/campaigns/*, /v1/studio/packs, /v1/studio/packs/*, /v1/billing, /v1/billing/*]
      upstreams:
        - name: svc-orchestrator
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: https://console.volumeos.example.com
            allow_methods: GET,POST,OPTIONS
            allow_headers: Authorization,Content-Type,Accept
            expose_headers: Content-Length
            max_age: 300
            allow_credential: false
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-orchestrator
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-orchestrator.core.svc.cluster.local, port: 80, weight: 100}

---
# Public ingress is limited to provider-signed webhooks. Checkout, receipt,
# balance, and ledger administration remain on authenticated internal APIs.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-collections-webhooks
  namespace: core
spec:
  http:
    - name: collection-webhooks
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/collections/webhooks/*]
      upstreams:
        - name: svc-collections
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-collections
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-collections.core.svc.cluster.local, port: 80, weight: 100}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: usage-rollup
  namespace: data
data:
  kafka-bootstrap-servers: kafka-kafka-bootstrap.data.svc.cluster.local:9092
  usage-topic: usage.events
  rollup-topic: usage.rollups
  # Late events may revise an open rollup; no ledger posting occurs before close.
  close-delay-hours: "48"
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: volumeos-m3-apis
  namespace: core
spec:
  http:
    - name: census-sync
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/tenants/*/census/*]
      upstreams: [{name: svc-census-sync}]
    - name: gold-query
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/query]
      upstreams: [{name: svc-query}]
    - name: report-search
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/tenants/*/search/*]
      upstreams: [{name: report-search}]
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata: {name: svc-census-sync, namespace: core}
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes: [{host: svc-census-sync.core.svc.cluster.local, port: 80, weight: 100}]
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata: {name: svc-query, namespace: core}
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes: [{host: svc-query.core.svc.cluster.local, port: 80, weight: 100}]
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata: {name: report-search, namespace: core}
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes: [{host: report-search.data.svc.cluster.local, port: 80, weight: 100}]
