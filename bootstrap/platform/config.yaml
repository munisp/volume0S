apiVersion: v1
kind: ConfigMap
metadata:
  name: volumeos-identity
  namespace: core
data:
  issuer: https://keycloak.sec.svc.cluster.local/realms/volumeos
  audience: core-services
  jwks-url: https://keycloak.sec.svc.cluster.local/realms/volumeos/protocol/openid-connect/certs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-worker
  namespace: workers
data:
  ai-gateway-url: http://svc-ai-gateway.core.svc.cluster.local
  tb-adapter-url: http://tb-adapter.core.svc.cluster.local
  campaign-dispatch-url: http://svc-campaigns.core.svc.cluster.local
  identity-admin-url: http://svc-identity-admin.core.svc.cluster.local
  tenancy-url: http://svc-tenancy.core.svc.cluster.local
  listmonk-admin-url: http://listmonk.core.svc.cluster.local
  postiz-provisioner-url: http://svc-postiz-provisioner.core.svc.cluster.local
  messaging-url: http://svc-campaigns.core.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-worker
  namespace: workers
data:
  # Set this to a reviewed internal GPU runtime; there is no public ComfyUI endpoint.
  comfyui-url: http://comfyui.ai.svc.cluster.local:8188
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: svc-tenancy
  namespace: core
spec:
  http:
    - name: tenancy
      match:
        hosts: [api.volumeos.example.com]
        paths: [/v1/tenants/*, /v1/workspaces, /v1/subscriptions]
      upstreams:
        - name: svc-tenancy
      # svc-tenancy independently verifies RS256 issuer/audience and tenant_id.
      # Add APISIX openid-connect after the Keycloak client secret is delivered by SOPS.
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: svc-tenancy
  namespace: core
spec:
  scheme: http
  loadbalancer: {type: roundrobin}
  nodes:
    - {host: svc-tenancy.core.svc.cluster.local, port: 80, weight: 100}
