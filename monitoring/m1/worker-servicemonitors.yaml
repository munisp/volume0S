apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: campaign-worker
  namespace: ops
  labels: {release: prometheus-grafana, app.kubernetes.io/part-of: volumeos}
spec:
  namespaceSelector: {matchNames: [workers]}
  selector: {matchLabels: {app.kubernetes.io/name: campaign-worker}}
  endpoints:
    - {port: metrics, path: /metrics, interval: 30s, scrapeTimeout: 10s}
---
