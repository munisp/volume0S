syntax = "proto3";
package volumeos.v1;
import "volumeos/v1/common.proto";

message AuditPublish {
  EventEnvelope envelope = 1;
  string workflow_id = 2;
  string campaign_id = 3;
  string approval_id = 4;
  string approver = 5;
  string artefact_uri = 6;
  string sha256 = 7;
  int64 published_at_unix = 8;
}
