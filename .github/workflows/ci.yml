name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml pytest
      - run: python scripts/verify_repo.py
      - run: python scripts/verify_m3.py
      - run: python scripts/verify_m4.py
      - run: python scripts/verify_native.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m pytest scripts/test_native_contracts.py scripts/test_restore_drill.py
      - uses: azure/setup-kubectl@v4
      - run: |
          for env in dev stage prod; do
            kubectl kustomize "deploy/overlays/$env" > "/tmp/volumeos-$env.yaml"
          done
          kubectl kustomize monitoring/m1 > /tmp/volumeos-m1-monitoring.yaml
  go-tenancy:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/core/svc-tenancy}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x', cache-dependency-path: apps/core/svc-tenancy/go.sum}
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
  go-provisioning:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/core/svc-provisioning}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
  python-worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/workers/campaign-worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e '.[test]'
      - run: PYTHONPATH=. python -m pytest
  python-studio-worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/workers/studio-worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e '.[test]'
      - run: PYTHONPATH=. python -m pytest
  python-synthetic-probe:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/workers/synthetic-probe}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e '.[test]'
      - run: PYTHONPATH=. python -m pytest
  python-offer-and-privacy-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: apps/core/svc-conversations
          - path: apps/core/svc-orchestrator
          - path: apps/core/svc-privacy
          - path: apps/core/svc-leads
          - path: apps/workers/offer-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/pyproject.toml
      - run: cd "${{ matrix.path }}" && python -m pip install -e '.[test]'
      - run: cd "${{ matrix.path }}" && PYTHONPATH=. python -m pytest
  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12.0'}
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=low
  rust-money-contract:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: libs-rust/tb-adapter}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy, rustfmt}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
