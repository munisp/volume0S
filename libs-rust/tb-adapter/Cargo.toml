[package]
name = "volumeos-tb-adapter"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "TigerBeetle account taxonomy, live transport, and idempotent two-phase money postings"

[lib]
name = "volumeos_tb_adapter"
path = "src/lib.rs"

[dependencies]
blake3 = "=1.5.5"
bytemuck = "1"
# Built for TigerBeetle 0.16.66, the cluster release (the official crate starts at 0.17).
tigerbeetle-unofficial = "=0.14.16+0.16.66"

[dev-dependencies]
futures = "=0.3.31"
